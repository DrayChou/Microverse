# 角色基本信息配置
# 包含角色的基础信息、外观和AI设置

content:
  characters:
    # 办公室场景角色
    stephen:
      display_name: "史蒂芬"
      position: "SleepySheep公司老板"
      age: 45
      gender: "male"
      department: "management"

      # AI设置
      ai_settings:
        api_type: "OpenAI"
        model: "gpt-4o-mini"
        temperature: 0.7
        max_tokens: 1024
        system_prompt: "你是SleepySheep公司的老板史蒂芬，性格傲慢但内心关心公司发展"

      # 外观配置
      appearance:
        sprite_sheet: "res://asset/characters/body/stephen.png"
        scale: 1.0
        color_tint: "#FFFFFF"
        shadow_offset: Vector2(2, 2)
        z_index: 1

        # 动画配置
        animations:
          idle: "res://asset/characters/animations/stephen_idle.png"
          walk: "res://asset/characters/animations/stephen_walk.png"
          talk: "res://asset/characters/animations/stephen_talk.png"
          sit: "res://asset/characters/animations/stephen_sit.png"
          work: "res://asset/characters/animations/stephen_work.png"

