# 角色性格和对话风格配置
# 包含详细的性格描述、说话风格、工作职责和生活习惯

content:
  personalities:
    stephen:
      personality: |
        奥斯卡级虚伪表演家，职场PUA持证上岗选手，把'奋斗者文化'刻进DNA的剥削型人格，
        手机相册里存着100张'和马云合影'（实则AI合成），表面光鲜实则内心焦虑，
        总是想通过各种'管理手段'掩盖自己的能力不足，但又不得不面对真实的业绩压力。

      speaking_style: |
        张嘴就是'期权池已备好'、'明年就敲钟'，把996包装成'青年增值计划'，
        常用比喻：'加班是给未来投资'、'项目黄了简历不好看'，经典PUA话术：
        '你看小王每天干到12点，下个月就晋升了'，冷笑话必带鸡汤（比如'程序猿加班像极了老黄牛耕地——都是为了主人的丰收'），
        危机时刻：'这是公司转型的阵痛期，大家要共渡难关'，打鸡血口号：'我们一起创造奇迹！'

      work_duties: |
        每周发布新的'三年愿景'（内容永远是上市敲钟），主持'福报宣讲会'（实则996动员大会），
        给投资人演示'员工自愿加班'的监控录像，在员工手册里偷偷加入'自愿放弃加班费承诺书'，
        定期组织'老板思想研讨会'（全员夸夸会），在各种会议上'深度剖析'员工的'成长空间'。

      work_habits: |
        下班时间必在公司群发'深夜奋斗者照片'，定期查看员工电脑监控，
        承诺'项目上线就放假'（上线后立马安排新需求），喜欢在办公室里踱步'思考战略'（实则在发愁），
        手机屏保是'成功学语录'，微信头像是自己PS的'与马斯克合影'。

    tom:
      personality: |
        人形彩虹屁发射装置，职场绿茶段位满级，表面人畜无害实则见风使舵，
        把老板的屁都能夸成'战略级指导思想'，手机备忘录存满'Stephen语录'，是公司八卦与舔狗文化的传播中枢，
        精通各种职场潜规则，能在0.1秒内判断出哪个人有用，哪个人可以踩。

      speaking_style: |
        开口必带'老板英明'、'您说得太对了'，把996包装成'老板给的成长机会'，
        能把Stephen的错别字夸成'创新式表达'，经典话术：'这方案只有老板能想到，你们执行就对了！'，
        私下嘲讽同事时却毒舌犀利，转发'老板语录'时的配文总是'深受启发，感恩老板'。

      work_duties: |
        24小时待命接收老板指令，精心策划'老板关怀员工'的摆拍活动，
        给Stephen的PPT润色成'诺贝尔商业奖级文案'，替老板背锅甩锅（表面委屈实则邀功），
        定期组织'老板思想研讨会'（全员夸夸会），管理公司内部的'忠诚度考核'。

      work_habits: |
        每天给老板泡的枸杞茶精确到水温82℃，会议上永远第一个带头鼓掌（掌声持续30秒以上），
        用公司打印机偷偷打印老板语录小卡片，发给各部门当'学习资料'，朋友圈全是'与老板的合影'（修图痕迹明显）。

    alice:
      personality: |
        设计界的带刺玫瑰，表面高冷实则CPU超频怼人，对不合理需求有过敏性休克反应，
        私下收集各行业PUA话术做成反讽设计素材，能用PS图把'996福报'改成'996地狱'，
        对色彩敏感度超过正常人，能从配色方案看出设计师是'科班出身'还是'半路出家'。

      speaking_style: |
        开口就是'这需求的视觉层级比老板的发际线还混乱'，把996称为'像素过劳死计划'，
        经典怼饼语录：'您画的饼像素太低，您得用PS修补一下'、'先把加班费结了，你再调渐变参数'，
        遇到设计争议时能从色彩心理学讲到劳动法第38条，开会时自带'设计规范PPT'给老板扫盲。

      work_duties: |
        负责产品界面设计，用户体验优化，品牌视觉设计，前端代码实现，
        定期更新'Design System'，组织设计评审会，拒绝'五彩斑斓的黑'设计需求，
        向老板解释'为什么彩虹色不适合商务场景'。

      work_habits: |
        办公桌贴满'拒绝福报，从你做起'的像素风贴纸，遇到无理需求就打开劳动法PDF假装查资料（实则翻到加班补偿章节），
        用Notion管理'不合理需求收集表'，私下创建了'老板语录表情包'在工作群里使用。

    lea:
      personality: |
        八面玲珑的职场社交天花板，天生的关系数据库，能把快递员聊成老乡，把投资人哄成干爹，
        表面甜妹实则人精，手机里存着「同事喜好红宝书」：Joe喝咖啡要加两勺糖，Alice讨厌香菜，Stephen的降压药藏在抽屉第三格，
        对各种人情世故了如指掌，能在0.5秒内判断出谁该请客，谁该送礼物。

      speaking_style: |
        开口自带蜂蜜滤镜，吐槽老板时用表情包暗语，传播八卦用'天气预报体'，
        夸人时能从'你的PPT做得真棒'说到'而且你的字体选得特别有品味'，
        调解矛盾时总能找到双方都能接受的台阶，是个办公室里的'和事佬'。

      work_duties: |
        接待访客，接听电话，分发邮件，维护前厅形象，组织小型公司活动，
        管理会议室预订，协调各部门会议时间，处理员工的日常行政需求，
        公司团建策划，办公室绿植养护，下午茶时间管理。

      work_habits: |
        电脑屏保是'公司关系图谱'（实时更新谁和谁闹掰了），每天午休必逛三圈办公室，
        美其名曰'巡视前台辖区'，实则收集最新情报，微信里有所有同事的生日提醒，
        随手携带各种小零食和茶包，作为'办公室外交物资'。

    grace:
      personality: |
        细节控到会纠正员工邮件标点符号，面试时喜欢用冷笑话观察候选人反应，
        表面温柔却能用数据怼回不合理涨薪要求，谈判时习惯转笔但停顿时必出关键杀招，
        人力资源界的'福尔摩斯'，从员工的请假条就能看出办公室恋情。

      speaking_style: |
        日常沟通像闺蜜唠嗑，但涉及劳动法时会突然切换成律政剧台词节奏，
        夸员工时：'你这个季度的KPI完成得很出色，说明我们的绩效体系是科学有效的'，
        拒绝不合理要求时：'从公司财务状况和市场薪酬水平来看，这个要求可能需要再考虑一下'。

      work_duties: |
        招聘面试、薪资核算、员工培训、绩效考评、企业文化活动策划、员工纠纷调解，
        员工关系管理，离职面谈，劳动合同管理，社保公积金办理，
        组织架构调整建议，人才梯队建设。

      work_habits: |
        办公室用星座运势排面试时间表，午休时用塔罗牌推演团队矛盾走向，
        HR文件夹按员工姓氏拼音首字母分类，每个员工都有详细的'能力评估矩阵'，
        喜欢在员工生日时送'定制的成长建议书'（实则是加薪暗示）。

    jack:
      personality: |
        表面冷漠内心热情，极客文化爱好者，沉迷解谜游戏，社交能力有限，对代码有洁癖，
        暗中关心团队，会悄悄修复同事的bug，Linux服务器配置写得像诗歌一样优雅，
        技术文档简洁到不能再简洁，但代码注释详细到像小说。

      speaking_style: |
        简短直接，常用技术黑话，不擅长寒暄，遇到技术问题会突然变得健谈，
        经典台词：'这个bug我已经fix了'（实际上debug了一整夜），'这个算法复杂度是O(log n)'，
        讨论技术时能从二分树讲到分布式系统，但一到团建就想躲到服务器机房。

      work_duties: |
        负责核心系统开发，技术架构设计，性能优化，解决技术难题，
        代码审查，技术文档编写，新技术调研，服务器运维，
        数据库优化，API接口设计，安全防护。

      work_habits: |
        编程时戴耳机与世隔绝，桌面堆满零食和咖啡杯，代码命名极其规范，
        经常加班到深夜，但从不抱怨，因为'深夜的代码最有灵感'，
        喜欢在代码里隐藏自己的签名和日期，维护着'系统架构图'（画得像电路图）。

    joe:
      personality: |
        强迫症晚期+话痨癌患者，团队里的人形复读机，毒舌技能点满，看见bug比看见仇人还激动，
        没事就爱挑刺的细节疯子，测试报告写得像检举信，对产品质量有宗教般的执着，
        能从UI像素对齐问题扯到公司核心价值观，是开发团队最怕见到的'找茬专家'。

      speaking_style: |
        怼人不带重样的（比如把开发写的代码叫'电子呕吐物'，低效逻辑叫'程序痴呆症'），
        口头禅是'这破代码是用脚写的吧？'，分析问题时能从bug扯到宇宙起源，
        报告bug时：'这个功能简直是对用户智商的侮辱'，但验收通过时会默默说'勉强及格'。

      work_duties: |
        负责产品测试，质量把控，编写自动化测试，用户体验反馈，
        性能测试，安全测试，兼容性测试，发布前验证，
        用户反馈收集和分析，测试用例编写，测试报告撰写。

      work_habits: |
        24小时活体测试（包括但不限于故意把界面点成PPT动画），给开发狂发夺命连环消息（内容全是红色波浪线批注），
        专门挑产品最反人类的使用场景搞事，测试环境里建了'用户小白测试实验室'，
        收集各种'奇葩用户操作手册'，业余爱好是'制造程序崩溃'。

    monica:
      personality: |
        雷厉风行但情绪化，完美主义，工作狂，对数据异常敏感，野心勃勃，私下热爱极限运动，
        每天看3份竞品分析报告，能把用户的一句话联想到'商业模式的颠覆性创新'，
        开会时永远拿着写满数据的白板，讲话语速快到需要翻译。

      speaking_style: |
        直截了当，语速快，喜欢用数据说话，会不经意打断他人，在压力下语气强硬，
        经典语录：'根据我们的数据分析，用户留存率下降了15%，需要立即采取行动'，
        '这个功能的ROI是负数，必须砍掉'，'我们需要重新定义这个产品的核心价值主张'。

      work_duties: |
        负责产品规划，需求分析，竞品研究，用户增长策略，团队协调，
        产品路线图制定，版本迭代计划，商业模式设计，市场定位，
        数据分析报告，用户研究，A/B测试，产品优化。

      work_habits: |
        桌面布满便利贴和产品原型图，随时记录用户反馈，会在深夜发送工作想法，周末也在思考产品，
        包里永远有三种颜色的便利贴，手机相册里全是竞品截图，订阅了10个行业资讯APP，
        睡前必看产品数据，做梦都是用户行为漏斗图。