# 网络客户端配置 - Godot 4.4优化版
# 包含网络连接、数据传输、API调用等配置

runtime:
  network:
    # 网络基础配置
    client:
      # 连接设置
      connection:
        default_timeout: 30.0
        max_retries: 3
        retry_delay: 1.0
        keep_alive: true
        keep_alive_interval: 30.0

      # 协议配置
      protocols:
        http:
          user_agent: "Microverse/1.0 (Godot 4.4)"
          max_redirects: 5
          follow_redirects: true

        https:
          verify_certificates: true
          cert_bundle_path: ""

        websocket:
          ping_interval: 30.0
          ping_timeout: 10.0
          max_message_size: 1048576  # 1MB

    # HTTP客户端配置
    http_client:
      # 连接池
      connection_pool:
        max_connections: 10
        keep_alive_timeout: 60.0
        idle_timeout: 300.0

      # 请求配置
      requests:
        default_headers:
          "Content-Type": "application/json"
          "Accept": "application/json"
          "User-Agent": "Microverse-Client/1.0"

        max_request_size: 10485760  # 10MB
        timeout_per_request: 60.0

      # 响应配置
      responses:
        buffer_size: 8192
        max_response_size: 52428800  # 50MB
        compression: ["gzip", "deflate"]

    # API调用配置
    api:
      # AI服务API
      ai_services:
        # 通用设置
        common:
          timeout: 30.0
          max_retries: 2
          retry_delay: 2.0

        # LMStudio (本地)
        lmstudio:
          base_url: "http://localhost:11435"
          endpoints:
            chat: "/v1/chat/completions"
            models: "/v1/models"
          headers:
            "Content-Type": "application/json"

        # OpenAI
        openai:
          base_url: "https://api.openai.com"
          endpoints:
            chat: "/v1/chat/completions"
            models: "/v1/models"
          headers:
            "Content-Type": "application/json"
            "Authorization": "Bearer {api_key}"

        # Claude (Anthropic)
        claude:
          base_url: "https://api.anthropic.com"
          endpoints:
            messages: "/v1/messages"
            models: "/v1/models"
          headers:
            "Content-Type": "application/json"
            "Authorization": "Bearer {api_key}"
            "anthropic-version": "2023-06-01"

      # 数据分析API
      analytics:
        enabled: false
        endpoint: "https://analytics.microverse.game/api/events"
        batch_size: 10
        batch_timeout: 60.0
        headers:
          "Authorization": "Bearer {analytics_key}"

    # 缓存配置
    cache:
      # HTTP缓存
      http_cache:
        enabled: true
        max_size_mb: 100
        default_ttl: 3600  # 1小时
        max_ttl: 86400  # 24小时

      # API响应缓存
      api_cache:
        enabled: true
        max_entries: 1000
        default_ttl: 1800  # 30分钟
        key_prefix: "api_cache"

    # 安全配置
    security:
      # API密钥管理
      api_keys:
        storage_method: "environment"  # environment, file, memory
        encryption_enabled: true
        key_rotation_days: 90

      # 请求限制
      rate_limiting:
        enabled: true
        requests_per_minute: 60
        burst_size: 10
        penalty_time: 60

      # 数据验证
      validation:
        sanitize_input: true
        validate_json: true
        max_field_length: 1000

    # 网络监控
    monitoring:
      # 性能监控
      performance:
        enabled: true
        log_slow_requests: true
        slow_threshold_ms: 1000
        track_response_sizes: true

      # 错误监控
      error_tracking:
        enabled: true
        log_errors: true
        max_error_log_size: 1000
        error_report_endpoint: ""

      # 连接监控
      connection_monitoring:
        enabled: true
        ping_interval: 60.0
        connection_timeout: 10.0
        auto_reconnect: true

    # 平台特定配置
    platform:
      # Web平台
      web:
        # CORS配置
        cors:
          enabled: true
          allowed_origins: ["*"]
          allowed_methods: ["GET", "POST", "PUT", "DELETE"]
          allowed_headers: ["Content-Type", "Authorization"]

        # WebSocket配置
        websocket:
          protocol: "wss"
          fallback_protocol: "ws"

      # 移动平台
      mobile:
        # 网络类型检测
        network_detection:
          enabled: true
          adapt_quality: true

        # 离线支持
        offline_support:
          enabled: true
          cache_requests: true
          sync_on_reconnect: true

      # 桌面平台
      desktop:
        # 代理支持
        proxy:
          auto_detect: true
          system_proxy: true
          custom_proxy: ""

        # DNS配置
        dns:
          custom_servers: []
          timeout: 5.0

    # 调试和开发
    debug:
      # 网络日志
      logging:
        enabled: true
        log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
        log_requests: false
        log_responses: false
        max_log_size_mb: 50

      # 开发工具
      tools:
        network_inspector: false
        request_builder: false
        response_viewer: false

      # 测试配置
      testing:
        mock_responses: false
        simulate_latency: false
        simulate_errors: false