# 场景配置文件
scenes:
  office:
    display_name: "办公室"
    description: |
      现代化的开放式办公室，有多个工作区、会议室和休息区。
      装修简洁明亮，有大窗户可以看到外面的景色。
      工作环境轻松愉快，鼓励创新和团队合作。
    company_name: "CountSheep游戏公司"
    company_description: |
      一家专注于休闲小游戏开发的创新公司，主要产品是《CountSheep》小游戏。
      游戏宣传语：Can't Sleep? Count Sheep。
      游戏玩法：通过让用户数手机屏幕上跳过的小羊，然后有九宫格数字按钮来计数得分。
      该游戏目前十分流行，吸引了许多跟时髦的小青年充值购买小羊皮肤和按键皮肤。
    environment_description: |
      这是一家现代化的公司，有多个工作区、会议室和休息区。
      办公室装修简洁明亮，有大窗户可以看到外面的景色。
      工作环境轻松愉快，鼓励创新和团队合作。
    time_period: "现代（2024年）"
    cultural_context: |
      现代都市办公文化，注重工作与生活平衡，团队协作和创新思维。
    economic_situation: |
      公司处于快速发展期，游戏收入稳定增长，员工待遇良好。
    social_rules:
      - "工作时间内应保持专业态度"
      - "鼓励团队合作和知识分享"
      - "尊重同事的个人空间和工作习惯"
      - "会议室使用需要提前预约"
      - "保持工作区域整洁"
      - "午休时间可以适当放松"
      - "重要决策需要团队讨论"
    rooms:
      - name: "main_office"
        display_name: "主办公区"
        description: "主要的办公工作区域"
        position: [400, 300]
        size: [600, 400]
      - name: "meeting_room"
        display_name: "会议室"
        description: "用于开会和讨论的房间"
        position: [200, 200]
        size: [150, 100]
      - name: "break_room"
        display_name: "休息室"
        description: "员工休息和非正式交流的地方"
        position: [600, 200]
        size: [120, 80]