# 物理移动系统配置 - Godot 4.4优化版
# 充分利用Godot 4.4的PhysicsServer2D和NavigationServer2D特性

systems:
  physics:
    # 基础移动参数
      base_speed: 100.0
      acceleration: 200.0
      friction: 150.0
      max_speed: 300.0

      # Godot 4.4 NavigationServer2D优化
      navigation:
        # 导航代理参数
        agent:
          radius: 16.0
          height: 0.0
          neighbor_distance: 50.0
          max_neighbors: 10
          time_horizon: 1.0
          time_horizon_obstacles: 0.0
          max_speed: 200.0
          path_max_distance: 5.0
          target_desired_distance: 1.0
          avoidance_layers: 1
          avoidance_mask: 1
          avoidance_priority: 1.0

        # 寻路参数
        pathfinding:
          map_radius: 1000.0
          cell_size: 16
          link_radius: 4.0
          compute_path_cost_scale: 1.0
          edge_connection_margin: 1.0

        # 避障行为
        avoidance:
          enabled: true
          avoidance_enabled: true
          use_multiple_threads: true  # Godot 4.4多线程支持
          avoidance_layers: 1
          avoidance_mask: 1

      # 物理属性
      physics:
        # 碰撞层配置
        collision:
          layer: 1
          mask: 1
          safe_margin: 0.001
          exclude_layers: []

        # 物理参数
        gravity_scale: 1.0
        linear_damp: 0.1
        angular_damp: 1.0

        # Godot 4.4 物理服务器配置
        server_2d:
          cell_size: 16
          thread_model: "multi_threaded"  # single_threaded, multi_threaded
          max_threads: 4

      # 交互系统
      interaction:
        # 椅子交互
        chair:
          approach_distance: 25.0
          interaction_distance: 20.0
          click_detection_range: 32.0
          sit_down_duration: 0.5
          stand_up_duration: 0.3

        # 通用交互
        general:
          interaction_distance: 50.0
          detection_radius: 30.0

      # 状态机配置
      state_machine:
        states:
          idle:
            transitions: ["walking", "sitting", "interacting"]
            physics_mode: "character"
          walking:
            transitions: ["idle", "sitting"]
            physics_mode: "character"
          sitting:
            transitions: ["idle", "standing"]
            physics_mode: "static"
          interacting:
            transitions: ["idle"]
            physics_mode: "character"

      # 性能优化配置
      performance:
        # 距离LOD (Level of Detail)
        lod:
          enabled: true
          distances:
            high: 100
            medium: 300
            low: 600

          # LOD设置
          settings:
            high:
              physics_update_rate: 60
              navigation_update_rate: 30
            medium:
              physics_update_rate: 30
              navigation_update_rate: 15
            low:
              physics_update_rate: 15
              navigation_update_rate: 5

        # 批处理优化
        batch_processing:
          enabled: true
          batch_size: 10
          update_interval: 0.016  # 60 FPS

      # 调试和可视化
      debug:
        # 物理调试
        show_collision_shapes: false
        show_navigation_path: false
        show_agent_radius: false

        # 可视化选项
        visual_aids:
          enabled: false
          path_color: "#00FF00"
          agent_color: "#FF0000"
          collision_color: "#0000FF"